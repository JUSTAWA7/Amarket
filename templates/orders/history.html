{% extends 'base.html' %}

{% block content %}

<div class="container mt-5 mb-5">

<h2 class="mb-4"><i class="bi bi-receipt me-2"></i>Mening buyurtmalarim</h2>

<div class="premium-card table-responsive">

<table class="table table-striped mb-0">

<tr>
    <th>ID</th>
    <th>Sana</th>
    <th>Jami</th>
    <th>Holat</th>
</tr>

{% for order in orders %}

<tr>

<td>#{{ order.id }}</td>

<td>{{ order.created_at }}</td>

<td>${{ order.total_price }}</td>

<td>

<span class="badge bg-success">

{{ order.status }}

</span>

</td>

</tr>

{% empty %}

<tr>
<td colspan="4" class="text-center">
Hali buyurtma yo'q.
</td>
</tr>

{% endfor %}

</table>

</div>

</div>

{% endblock %}
