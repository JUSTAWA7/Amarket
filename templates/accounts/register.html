{% extends 'base.html' %}
{% load static %}

{% block content %}


<style>

.register-page{

    min-height:85vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    linear-gradient(
        135deg,
        #020617,
        #071a3d,
        #0f2f63
    );

    padding:20px;

}


/* Register Card */

.register-card{

    width:360px;

    padding:35px;


    background:

    rgba(255,255,255,0.08);


    backdrop-filter:blur(20px);


    border-radius:22px;


    border:

    1px solid

    rgba(255,255,255,0.15);


    box-shadow:

    0 20px 60px

    rgba(0,0,0,.5);


    color:white;

}



/* Title */

.register-card h2{

    text-align:center;

    font-size:26px;

    font-weight:800;

    margin-bottom:10px;

}



.subtitle{

    text-align:center;

    color:#cbd5e1;

    font-size:14px;

    margin-bottom:25px;

}




/* Form */

.register-card p{

    margin-bottom:15px;

}



.register-card label{

    color:#e2e8f0;

    font-size:13px;

    display:block;

    margin-bottom:5px;

}



.register-card input{


    width:100%;


    padding:12px 14px;


    border:none;


    outline:none;


    border-radius:12px;


    background:

    rgba(255,255,255,.12);


    color:white;


    transition:.3s;

}



.register-card input:focus{


    background:

    rgba(255,255,255,.18);


    box-shadow:

    0 0 15px

    rgba(37,99,235,.8);


}



.register-card input::placeholder{

    color:#94a3b8;

}



/* Button */


.register-btn{


    width:100%;


    padding:13px;


    margin-top:10px;


    border:none;


    border-radius:12px;


    background:


    linear-gradient(

        135deg,

        #2563eb,

        #1e40af

    );


    color:white;


    font-size:15px;


    font-weight:700;


    cursor:pointer;


    transition:.3s;

}



.register-btn:hover{


    transform:translateY(-3px);


    box-shadow:

    0 15px 30px

    rgba(37,99,235,.5);


}



/* Login */

.login-text{


    text-align:center;


    margin-top:22px;


    color:#cbd5e1;


    font-size:14px;

}



.login-text a{


    color:#38bdf8;


    text-decoration:none;


    font-weight:700;


}


.login-text a:hover{

    color:white;

}



/* Errors */


.errorlist{

    color:#f87171;

    font-size:12px;

    list-style:none;

    padding:0;

}



</style>



<div class="register-page">


    <div class="register-card">



        <h2>

            Ro'yxatdan o'tish

        </h2>


        <p class="subtitle">

            Premium Market hisobini yarating

        </p>




        <form method="post">

            {% csrf_token %}


            {{ form.as_p }}



            <button class="register-btn"
                    type="submit">

                Hisob yaratish

            </button>


        </form>




        <div class="login-text">


            Hisobingiz bormi?


            <a href="{% url 'login' %}">

                Tizimga kirish

            </a>


        </div>



    </div>


</div>



{% endblock %}
